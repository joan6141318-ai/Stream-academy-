<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Setup -->
    <meta name="theme-color" content="#7c3aed" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StreamAgency" />
    <link rel="apple-touch-icon" href="https://i.postimg.cc/65zvGzJL/IMG_20251102_060134.png" />
    
    <title>StreamAgency Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'Helvetica Neue', 'sans-serif'],
            },
            colors: {
              brand: {
                black: '#0a0a0a',
                dark: '#171717',
                purple: '#7c3aed',
                gray: '#FAFAFA',
                border: '#eeeeee',
                'dark-bg': '#000000',
                'dark-card': '#121212',
              }
            },
            borderRadius: {
              'none': '0',
              'sm': '2px',
              'DEFAULT': '4px',
            },
            spacing: {
              'safe-top': 'env(safe-area-inset-top)',
              'safe-bottom': 'env(safe-area-inset-bottom)',
            }
          }
        }
      }
    </script>
    <style>
      html { height: 100%; width: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; }
      body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #ffffff; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overscroll-behavior: none; user-select: none; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s ease; }
      html.dark body { background-color: #000000; color: #ffffff; }
      #root { height: 100%; width: 100%; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      input, textarea { user-select: text; appearance: none; -webkit-appearance: none; border-radius: 0; }
      .pt-safe { padding-top: env(safe-area-inset-top); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .mt-safe { margin-top: env(safe-area-inset-top); }
      .mb-safe { margin-bottom: env(safe-area-inset-bottom); }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1?deps=react@18.3.1",
    "react-router-dom": "https://esm.sh/react-router-dom@6.23.1?deps=react@18.3.1,react-dom@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.395.0?deps=react@18.3.1",
    "firebase/app": "https://esm.sh/firebase@10.12.2/app",
    "firebase/auth": "https://esm.sh/firebase@10.12.2/auth?deps=firebase@10.12.2",
    "firebase/firestore": "https://esm.sh/firebase@10.12.2/firestore?deps=firebase@10.12.2",
    "firebase/storage": "https://esm.sh/firebase@10.12.2/storage?deps=firebase@10.12.2",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/"
  }
}
</script>
  </head>
  <body class="bg-white text-brand-black dark:bg-brand-dark-bg dark:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="./index.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
